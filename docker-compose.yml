services:
  db:
    image: postgres:16
    container_name: calorie-counter-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: calorie_counter
      POSTGRES_USER: calorie_app
      POSTGRES_PASSWORD: calorie_dev_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calorie_app -d calorie_counter"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: